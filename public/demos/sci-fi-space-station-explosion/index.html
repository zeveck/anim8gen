<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sci-fi-space-station-explosion preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d22;
      --muted: #66666f;
      --panel: #f6f4ee;
      --line: #cbc8bd;
      --accent: #2776b8;
      --warn: #c94a36;
      --checker-a: #d9d9d9;
      --checker-b: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #ece8dc;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .stage-row {
      display: grid;
      grid-template-columns: minmax(560px, 1fr) 300px;
      gap: 20px;
      align-items: start;
    }
    .side {
      display: grid;
      gap: 12px;
      grid-template-rows: 430px 176px;
      align-items: start;
    }
    .stage {
      position: relative;
      min-height: 618px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background-color: var(--checker-b);
      background-image:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      overflow: hidden;
    }
    .mini {
      display: grid;
      gap: 6px;
      justify-items: center;
      align-content: center;
      height: 176px;
      padding: 8px;
      border: 1px solid var(--line);
      background: #fffdf8;
    }
    .mini canvas {
      width: 128px;
      height: 128px;
    }
    .mini-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }
    .stage.plain {
      background: #f4f0e6;
    }
    canvas {
      width: min(576px, calc(100vw - 64px));
      height: auto;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .zs {
      position: absolute;
      left: 50%;
      top: 39%;
      width: 160px;
      height: 140px;
      pointer-events: none;
      transform: translate(-4%, -50%);
      opacity: 0;
    }
    .zs.active {
      opacity: 1;
    }
    .z {
      position: absolute;
      color: #5b6db7;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.75);
      animation: drift 1600ms linear infinite;
    }
    .z:nth-child(1) { left: 18px; bottom: 12px; font-size: 22px; animation-delay: 0ms; }
    .z:nth-child(2) { left: 60px; bottom: 44px; font-size: 28px; animation-delay: 260ms; }
    .z:nth-child(3) { left: 106px; bottom: 82px; font-size: 36px; animation-delay: 520ms; }
    @keyframes drift {
      from { transform: translateY(16px); opacity: 0; }
      20% { opacity: 1; }
      78% { opacity: 1; }
      to { transform: translateY(-26px); opacity: 0; }
    }
    .controls {
      display: grid;
      gap: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
      height: 430px;
      align-content: start;
      overflow: hidden;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      min-height: 38px;
      border: 1px solid #a8a496;
      background: #fffdf8;
      color: var(--ink);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    input[type="range"] { width: 100%; }
    .fps-row {
      position: relative;
      display: grid;
      gap: 6px;
    }
    .fps-readout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .mini-button {
      min-height: 24px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 650;
    }
    .toggles {
      display: grid;
      gap: 8px;
    }
    .toggle[hidden] {
      display: none;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }
    .frame-card {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 4px;
    }
    .frame-label {
      font-size: 18px;
      font-weight: 700;
    }
    .pose {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      height: 54px;
      overflow: auto;
    }
    .strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
      gap: 6px;
    }
    .thumb {
      border: 2px solid transparent;
      background: #fffdf8;
      padding: 2px;
      cursor: pointer;
    }
    .thumb.active { border-color: var(--accent); }
    .thumb img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 760px) {
      .stage-row { grid-template-columns: 1fr; }
      .stage { min-height: min(520px, calc(100vw - 32px)); }
      .side { grid-template-rows: auto; }
      .controls { height: auto; }
      header { align-items: start; flex-direction: column; }
      .meta { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>sci-fi-space-station-explosion</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="stage-row">
      <section class="stage" id="stage" aria-label="Sprite preview stage">
        <canvas id="sprite" width="512" height="512"></canvas>
        <div class="zs" id="zs" aria-hidden="true"><span class="z">Z</span><span class="z">Z</span><span class="z">Z</span></div>
      </section>
      <div class="side">
        <section class="controls" aria-label="Playback controls">
          <div class="buttons">
            <button type="button" id="prev" title="Previous frame">Prev</button>
            <button type="button" id="play" title="Play or pause">Pause</button>
            <button type="button" id="next" title="Next frame">Next</button>
          </div>
          <label class="fps-row">FPS
            <input type="range" id="fps" min="1" max="16" step="1">
            <span class="fps-readout"><span id="fpsValue"></span><button class="mini-button" type="button" id="specFpsButton"></button></span>
          </label>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="checker" checked> Checkerboard</label>
            <label class="toggle"><input type="checkbox" id="zToggle" checked> Sleeping Zs</label>
          </div>
          <div class="frame-card">
            <div class="frame-label" id="frameLabel"></div>
            <div class="pose" id="pose"></div>
          </div>
          <div class="strip" id="strip"></div>
        </section>
        <div class="mini" aria-label="Spec speed preview">
          <canvas id="miniSprite" width="512" height="512"></canvas>
        </div>
      </div>
    </div>
  </main>
  <script>
    const payload = {"id":"sci-fi-space-station-explosion","canvas":[512,512],"fps":4,"playbackIndexes":[0,1,2,3,4,5],"previewStrategy":"canvas-playback","runtimeEffects":[],"frames":[{"index":0,"label":"idle","pose":"large sci-fi space station intact, centered in deep space with stars, calm before explosion","reuseFrame":null,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-000.idle.png"},{"index":1,"label":"flash","pose":"same space station centered, sudden bright orange white flash starting from the core, small debris beginning","reuseFrame":null,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-001.flash.png"},{"index":2,"label":"explosion","pose":"same station breaking apart in a cool large orange yellow explosion, debris expanding outward, station silhouette still partly visible","reuseFrame":null,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-002.explosion.png"},{"index":3,"label":"debris","pose":"aftermath of the same station explosion, fading fireball, scattered debris, smoke glow, deep space stars still visible","reuseFrame":null,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-003.debris.png"},{"index":4,"label":"floating-debris","pose":"quiet aftermath after the explosion, fireball gone, broken station pieces and ring fragments slowly floating in deep space, only faint embers and stars visible","reuseFrame":null,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-004.floating-debris.png"},{"index":5,"label":"floating-debris-hold","pose":"same quiet floating debris aftermath held for one extra frame","reuseFrame":4,"sleep":false,"displayOffset":{"x":0,"y":0},"src":"frames/frame-005.floating-debris-hold.png"}]};
    const canvas = document.getElementById("sprite");
    const ctx = canvas.getContext("2d");
    const miniCanvas = document.getElementById("miniSprite");
    const miniCtx = miniCanvas.getContext("2d");
    const stage = document.getElementById("stage");
    const zs = document.getElementById("zs");
    const frameLabel = document.getElementById("frameLabel");
    const pose = document.getElementById("pose");
    const playButton = document.getElementById("play");
    const fpsInput = document.getElementById("fps");
    const fpsValue = document.getElementById("fpsValue");
    const specFpsButton = document.getElementById("specFpsButton");
    const checkerInput = document.getElementById("checker");
    const zToggle = document.getElementById("zToggle");
    const meta = document.getElementById("meta");
    const strip = document.getElementById("strip");
    const images = [];
    let frameIndex = 0;
    let playbackPosition = 0;
    let miniPlaybackPosition = 0;
    let playing = true;
    let lastTime = 0;
    let miniLastTime = 0;

    ctx.imageSmoothingEnabled = false;
    miniCtx.imageSmoothingEnabled = false;
    fpsInput.value = fpsInput.min || 1;
    meta.textContent = `${payload.frames.length} frames`;

    function updateFpsUi() {
      const min = Number(fpsInput.min || 1);
      const max = Number(fpsInput.max || 16);
      const spec = Math.min(max, Math.max(min, Number(payload.fps || min)));
      fpsValue.textContent = `${fpsInput.value} FPS`;
      specFpsButton.textContent = "Default";
    }

    function loadImages() {
      return Promise.all(payload.frames.map((frame, index) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          images[index] = img;
          resolve();
        };
        img.onerror = reject;
        img.src = frame.src;
      })));
    }

    function renderStrip() {
      strip.innerHTML = "";
      payload.frames.forEach((frame, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb";
        button.title = `${frame.index} ${frame.label}`;
        const img = document.createElement("img");
        img.alt = frame.label;
        img.src = frame.src;
        button.appendChild(img);
        button.addEventListener("click", () => {
          frameIndex = index;
          playbackPosition = Math.max(0, payload.playbackIndexes.indexOf(index));
          render();
        });
        strip.appendChild(button);
      });
    }

    function render() {
      const frame = payload.frames[frameIndex];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(images[frameIndex], frame.displayOffset.x, frame.displayOffset.y);
      frameLabel.textContent = `${String(frame.index).padStart(3, "0")} ${frame.label}`;
      pose.textContent = frame.pose;
      zs.classList.toggle("active", hasSleepingZs && zToggle.checked && frame.sleep);
      [...strip.children].forEach((child, index) => child.classList.toggle("active", index === frameIndex));
    }

    function renderMini() {
      const index = payload.playbackIndexes[miniPlaybackPosition] ?? 0;
      const frame = payload.frames[index];
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
      miniCtx.imageSmoothingEnabled = false;
      miniCtx.drawImage(images[index], frame.displayOffset.x, frame.displayOffset.y);
    }

    function step(delta) {
      playbackPosition = (playbackPosition + delta + payload.playbackIndexes.length) % payload.playbackIndexes.length;
      frameIndex = payload.playbackIndexes[playbackPosition];
      render();
    }

    function tick(time) {
      const interval = 1000 / Number(fpsInput.value || payload.fps);
      if (playing && time - lastTime >= interval) {
        step(1);
        lastTime = time;
      }
      const miniInterval = 1000 / Number(payload.fps || 8);
      if (time - miniLastTime >= miniInterval) {
        miniPlaybackPosition = (miniPlaybackPosition + 1) % payload.playbackIndexes.length;
        renderMini();
        miniLastTime = time;
      }
      requestAnimationFrame(tick);
    }

    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    playButton.addEventListener("click", () => {
      playing = !playing;
      playButton.textContent = playing ? "Pause" : "Play";
    });
    checkerInput.addEventListener("change", () => stage.classList.toggle("plain", !checkerInput.checked));
    zToggle.addEventListener("change", render);
    fpsInput.addEventListener("input", updateFpsUi);
    specFpsButton.addEventListener("click", () => {
      fpsInput.value = String(payload.fps || 1);
      updateFpsUi();
    });
    window.addEventListener("resize", updateFpsUi);
    const hasSleepingZs = payload.runtimeEffects.includes("sleeping-zs");
    zToggle.closest(".toggle").hidden = !hasSleepingZs;

    loadImages().then(() => {
      renderStrip();
      updateFpsUi();
      render();
      renderMini();
      requestAnimationFrame(tick);
    }).catch((error) => {
      frameLabel.textContent = "Preview failed to load";
      pose.textContent = String(error);
    });
  </script>
</body>
</html>
